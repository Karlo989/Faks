<!DOCTYPE html>
<html lang="hr">
  <head>
  <meta charset="UTF-8" />
  <title>Svijet Penjanja - Kontakt</title>

  <!-- Google Fonts -->
  <link
    rel="stylesheet"
    href="https://fonts.googleapis.com/css2?family=Roboto:wght@400;700&family=Lobster&display=swap"
  />

  <!-- Vanjski CSS -->
  <link rel="stylesheet" href="style.css" />
</head>

  <body>
    <center>
      <header>
        <div class="banner">
          <img src="https://i.imgur.com/8S9xv1g.jpeg" alt="Umjetno penjanje" />
        </div>

        <nav class="main-nav">
          <ul>
            <li><a href="index.html">Početna</a></li>
            <li><a href="#">Lokacije</a></li>
            <li><a href="#">Oprema</a></li>
            <li><a href="kontakt.html">Kontakt</a></li>
            <li><a href="galerija.html">Galerija</a></li>
            <li>
              <a href="https://www.ifsc-climbing.org" target="_blank"
                >Službena IFSC stranica</a
              >
            </li>
          </ul>
        </nav>
      </header>
      <section class="kontakt">
        <h2>Kontaktirajte nas</h2>
        <br />
        <p>
          Ako imate neko pitanje o nama ili o sportu, ispunite kontakt obrazac u
          nastavku.
        </p>
        <br />
        <form class="kontakt-forma" action="#" method="post">
          <div class="form-row">
            <label for="ime">Ime</label>
            <input
              type="text"
              id="ime"
              name="ime"
              placeholder="Vaše ime..."
              required
            />
          </div>
          <div class="form-row">
            <label for="prezime">Prezime</label>
            <input
              type="text"
              id="prezime"
              name="prezime"
              placeholder="Vaše prezime..."
              required
            />
          </div>
          <div class="form-row">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Vaš email..."
              required
            />
          </div>
          <div class="form-row">
            <label for="country">Penjaona</label>
            <select id="country" name="country">
              <option value="hive">Hive</option>
              <option value="boulderzona">Boulder Zona</option>
              <option value="drugo">Drugo</option>
            </select>
          </div>
          <div class="form-row">
            <label for="subject">Poruka</label>
            <textarea
              id="subject"
              name="subject"
              rows="6"
              placeholder="Napišite svoju poruku..."
            ></textarea>
          </div>
          <div class="form-row">
            <p><strong>Events</strong></p>
            <div class="option">
              <input type="checkbox" id="newsletter" name="events" />
              <label for="newsletter"
                >Želim primati obavijesti o eventima</label
              >
            </div>
          </div>
          <div class="form-row">
            <p><strong>Želim odgovor putem:</strong></p>
            <div class="option">
              <input
                type="radio"
                id="reply-email"
                name="reply-method"
                value="email"
                checked
              />
              <label for="reply-email">E-maila</label>
            </div>
            <div class="option">
              <input
                type="radio"
                id="reply-sms"
                name="reply-method"
                value="sms"
              />
              <label for="reply-sms">SMS poruke</label>
            </div>
          </div>
          <div class="form-row">
            <label for="ticket-id">ID vašeg upita (IN WORKS!)</label>
            <input
              type="text"
              id="ticket-id"
              name="ticket-id"
              value="#MSG-2025-HV"
              disabled
            />
          </div>
          <div class="form-row">
            <input type="submit" value="Pošalji" />
          </div>
        </form>
      </section>
    </center>
    <br />
    <footer>&copy; 2025 Karlo Čunčić</footer>
  </body>
</html>
